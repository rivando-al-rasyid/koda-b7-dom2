<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokeAPI 4-Column Grid</title>
  <style>

    body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }

    /* The Grid Container */
    #pokemon-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* Creates 4 equal columns */
      gap: 15px;
      list-style: none;
      padding: 0;
    }

    /* Individual Cards */
    section {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-transform: capitalize;
      text-align: center;
    }

    img { width: 96px; height: 96px; margin-bottom: 10px; }

    .name { font-weight: bold; margin-bottom: 8px; display: block; }

    .type-tag {
      background: #e0e0e0;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #333;
      font-weight: bold;
    }

    /* Responsive: switch to 2 columns on tablets, 1 on mobile */
    @media (max-width: 900px) { #pokemon-list { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { #pokemon-list { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <main id="pokemon-list">
  </main>

  <script>
    const mainUrl = "https://pokeapi.co/api/v2/pokemon/?limit=30"; // Limit changed to 30
      const typeColors = {
      normal:  '#A8A77A',
      fire:    '#EE8130',
      water:   '#6390F0',
      electric:'#F7D02C',
      grass:   '#7AC74C',
      ice:     '#96D9D6',
      fighting:'#C22E28',
      poison:  '#A33EA1',
      ground:  '#E2BF65',
      flying:  '#A98FF3',
      psychic: '#F95587',
      bug:     '#A6B91A',
      rock:    '#B6A136',
      ghost:   '#735797',
      dragon:  '#6F35FC',
      dark:    '#705746',
      steel:   '#B7B7CE',
      fairy:   '#D685AD',
      };
    async function fetchPokemon() {
      try {
        const response = await fetch(mainUrl);
        const data = await response.json();
        const pokemonList = document.querySelector('#pokemon-list');

        // Fetch all details in parallel for better performance and order
        const pokemonData = await Promise.all(
          data.results.map(pokemon => fetch(pokemon.url).then(res => res.json()))
        );

        pokemonData.forEach(detailData => {
          const spriteUrl = detailData.sprites.front_default;
          const typeName = detailData.types.map(typeInfo => typeInfo.type.name).join(', ');
          const name = detailData.name;

          const listItem = document.createElement('section');
          listItem.innerHTML = `
            <img src="${spriteUrl}" alt="${name}">
            <span class="name">${name}</span>
            <span class="type-tag" style="background-color: ${typeColors[typeName.split(', ')[0]] || '#ccc'};">
              ${typeName}
            </span>
          `;

          pokemonList.appendChild(listItem);
        });

      } catch (error) {
        console.error('Error fetching Pokémon:', error);
      }
    }

    fetchPokemon();
  </script>
</body>
</html>
