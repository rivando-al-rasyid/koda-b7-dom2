<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Font Awesome Nav</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    :root {
      --bg-color: #333;
      --active-color: #027a3e;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; }

    nav {
      background-color: var(--bg-color);
      color: white;
      padding: 0 1rem;
    }

    /* --- Mobile Header --- */
    /* This container keeps the Brand and Hamburger on one line */
    .nav-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      color: white;
      text-decoration: none;
      padding: 14px 0;
      font-weight: bold;
    }

    .hamburger-btn {
      font-size: 24px;
      cursor: pointer;
      padding: 10px;
    }

    /* --- Navbar Links --- */
    #navbar {
      list-style: none;
      margin: 0;
      padding: 0;
      display: none; /* Hidden on mobile */
      flex-direction: column;
    }

    nav.open #navbar {
      display: flex;
    }

    #navbar li a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 14px 16px;
      border-top: 1px solid #444;
    }

    /* --- Desktop Styles (>=768px) --- */
    @media (min-width: 768px) {
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .hamburger-btn {
        display: none; /* Hide icon on desktop */
      }

      #navbar {
        display: flex !important; /* Always show */
        flex-direction: row;
      }

      #navbar li a {
        border-top: none;
      }
    }

    /* States */
    #navbar li a:hover { background-color: #ddd; color: black; }
    #navbar li a.active { background-color: var(--active-color); color: white; }
  </style>
</head>
<body>

  <nav id="main-nav">
    <div class="nav-top">
      <a href="#home" class="brand">NavBAr</a>
      <div class="hamburger-btn" id="menu-toggle">
        <i class="fa fa-bars"></i>
      </div>
    </div>

    <ul id="navbar">
      <style> @media (min-width: 768px) { .mobile-brand { display: none; } } </style>
      <li><a href="#news">News</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <script>
    const nav = document.getElementById('main-nav');
    const toggle = document.getElementById('menu-toggle');
    const icon = toggle.querySelector('i');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('open');

      // Optional: Switch icon from Bars to X when open
      if (nav.classList.contains('open')) {
        icon.classList.replace('fa-bars', 'fa-times');
      } else {
        icon.classList.replace('fa-times', 'fa-bars');
      }
    });

    // Close menu when a link is clicked
    document.querySelectorAll('#navbar a').forEach(link => {
      link.addEventListener('click', () => {
        nav.classList.remove('open');
        icon.classList.replace('fa-times', 'fa-bars');
      });
    });
  </script>

</body>
</html>
