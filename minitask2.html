<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Basic HTML5</title>
  <meta name="author" content="rivando al rasyid">
  <meta name="description" content="HTML5 Template">

  <meta property="og:title" content="HTML5 Template">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://">
  <meta property="og:description" content="HTML5 Template">

  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      background-color: #333;
      overflow: hidden;
    }

    nav ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
    nav ul li:first-child {
      float: left;
    }
    nav ul li {
      float: right;
    }

    nav ul li a {
      display: block;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }

    nav ul li a:hover {
      background-color: #ddd;
      color: black;
    }

    nav ul li a.active {
      background-color: #027a3e;
      color: white;
    }

  </style>
</head>

<body>
  <main>
    <nav>
      <ul>
        <li><a href="#home" class="active">WEBHOZZ</a></li>
        <li><a href="#news">News</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </main>

</body>
